<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>American English File 3 - Flashcards</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: Tahoma, sans-serif; }
body { background: #0f172a; color: #f8fafc; padding: 15px; max-width: 600px; margin: 0 auto; }
h1 { font-size: 1.3rem; color: #818cf8; text-align: center; margin-bottom: 20px; }

/* نوار تب‌ها */
.tabs-container { display: flex; gap: 10px; margin-bottom: 20px; }
.tab-btn { flex: 1; padding: 12px; background: #1e293b; color: #94a3b8; border: 1px solid #334155; border-radius: 8px; font-size: 1rem; cursor: pointer; font-weight: bold; }
.tab-btn.active { background: #4f46e5; color: white; border-color: #4f46e5; }

/* پنل‌ها */
.panel { display: none; }
.panel.active { display: block; }

/* کارت */
.card { background: #1e293b; border-radius: 12px; padding: 20px; border: 1px solid #334155; min-height: 250px; display: flex; flex-direction: column; justify-content: space-between; }
.word-text { font-size: 1.5rem; font-weight: bold; color: #38bdf8; direction: ltr; text-align: left; }
.example-text { font-size: 0.95rem; color: #cbd5e1; font-style: italic; direction: ltr; text-align: left; margin-top: 10px; background: #0f172a; padding: 10px; border-radius: 6px; }
.trans-box { display: none; margin-top: 15px; background: #111827; padding: 10px; border-radius: 6px; color: #facc15; text-align: right; }
.show-trans-btn { margin-top: 15px; background: #334155; color: white; border: none; padding: 8px 12px; border-radius: 6px; cursor: pointer; font-size: 0.85rem; align-self: flex-start; }
.actions { display: flex; gap: 10px; margin-top: 20px; }
.btn { flex: 1; padding: 14px; border: none; border-radius: 8px; font-size: 1rem; font-weight: bold; color: white; cursor: pointer; }
.btn-wrong { background: #ef4444; }
.btn-right { background: #22c55e; }
.btn-blue { background: #4f46e5; width: 100%; margin-top: 10px; }
.btn-sm { padding: 8px; font-size: 0.85rem; flex: none; width: auto; background: #334155; }

/* فرم‌ها */
input[type="text"], textarea { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; margin-bottom: 12px; font-family: monospace; font-size: 0.9rem; }
textarea { height: 150px; resize: vertical; }
.extract-item { background: #0f172a; padding: 12px; border-radius: 8px; margin-bottom: 10px; border-left: 3px solid #22c55e; }
.extract-item.sent { border-left-color: #f59e0b; }
.extract-item label { display: flex; align-items: center; gap: 8px; cursor: pointer; font-weight: bold; margin-bottom: 8px; }
.extract-item input[type="checkbox"] { width: 18px; height: 18px; }
</style>
</head>
<body>

<h1>American English File 3</h1>

<div class="tabs-container">
    <button class="tab-btn active" id="btn-tab-study" onclick="showTab('study')">📚 مرور</button>
    <button class="tab-btn" id="btn-tab-import" onclick="showTab('import')">➕ ورود متن</button>
</div>

<!-- تب مرور -->
<div id="panel-study" class="panel active">
    <div id="card-container">
        <p style="text-align:center; color:#94a3b8; padding: 30px;">هنوز درسی اضافه نکردی. برو به تب «ورود متن».</p>
    </div>
</div>

<!-- تب ورود متن -->
<div id="panel-import" class="panel">
    <p style="margin-bottom: 8px; font-size: 0.9rem;">نام درس:</p>
    <input type="text" id="input-unit-name" placeholder="مثلاً: Unit 1">
    
    <p style="margin-bottom: 8px; font-size: 0.9rem;">متن درس را پیست کنید:</p>
    <textarea id="input-lesson-text" placeholder="Paste your English text here..."></textarea>
    
    <button class="btn btn-blue" onclick="extractWords()">🔍 استخراج کلمات</button>
    <button class="btn btn-sm" style="width:100%; margin-top:10px;" onclick="fillSample()">استفاده از متن نمونه</button>
    
    <div id="preview-container" style="margin-top: 20px;"></div>
</div>

<script>
// دیتابیس کلمات (خلاصه شده برای سرعت)

perform peril period permanent permit persist personality perspective persuade phase phenomenon philosophy physical pile pioneer plausible plead pledge plot policy poll pollution populate portion portray pose positive possess potential poverty practical precede precise predict prejudice preliminary premise prescribe preserve prestige presume prevail prevent previous priority privacy privilege probe proceed process proclaim profession profile profit profound progress prohibit project prominent promote prompt pronounce proof proper property proportion proposal propose prospect prosper protect protest prove provide provoke psychology publish purchase pursue qualify quantity quote radical random range rank rapid rare rate ratio rational react reaction realistic rebel recall receive recent recession recognize recommend reconcile recover recruit reduce refer reflect reform refuse regard regime region register regulate reinforce reject relate relax release relevant reluctant rely remain remark remedy remind remove render renew repeat replace report represent reputation request require rescue research resemble reserve resident resign resist resolve resort resource respond restore restrain restrict result resume retail retain retire retreat reveal revenue reverse review revise revive reward rhythm ridiculous rigid riot rival robust routine rural sacrifice satisfy scale scan scarce scatter schedule scheme scope scrutiny secure seek segment seize seldom select sensible sensitive sequence series serve session settle severe shallow shelter shift shortage significant similar simulate sincere site situation skeptical slight smooth soar sole solid somewhat sophisticated soul source spare spark specialize species specific specify spectrum speculate sphere spill spite split sponsor spontaneous spot spread stability stable stake stance standard stare statistics status steady steep stem stimulate stir stock strain strategy stream strengthen stress strict strike strive structure struggle stubborn stumble subject submit subsequent subsidy substance substitute subtle succeed sufficient suggest suitable summarize superior supply support suppose suppress surface surge surpass surrender surround survey survive suspect suspend sustain switch symbol sympathy tackle tactic talent target task technique temporary tend tendency tense terminal terminate terrain terrible territory theme theory thereby thorough threat thrive tolerate toll topic torture trace trade tradition tragedy transfer transform transit transmit transparent trap treasure treat tremendous trend trigger triumph trivial tropical trust tunnel typical ultimate undergo underlie undertake uniform unify unique unite universal urban urge utilize utmost vacuum vague valid vanish vary vast vehicle venture venue version vertical vessel veteran viable vibrant victim vigorous violate virtual virtue visible vision vital vivid vocation volume voluntary vulnerable wander warrant wealth welfare whatsoever whereas widespread willing withdraw withstand witness workshop worship worth wound yield zone".split(" "));

// خواندن دیتابیس از حافظه مرورگر
let appData = JSON.parse(localStorage.getItem('aef3_data_v4') || '{}');
if (!appData.db) appData.db = {};

let currentQueue = []; 
let currentUnitName = "";
let lastExtractedData = null;

// تغییر تب‌ها
function showTab(tabName) {
    document.getElementById('panel-study').classList.remove('active');
    document.getElementById('panel-import').classList.remove('active');
    document.getElementById('btn-tab-study').classList.remove('active');
    document.getElementById('btn-tab-import').classList.remove('active');

    if (tabName === 'study') {
        document.getElementById('panel-study').classList.add('active');
        document.getElementById('btn-tab-study').classList.add('active');
        loadStudyTab();
    } else {
        document.getElementById('panel-import').classList.add('active');
        document.getElementById('btn-tab-import').classList.add('active');
    }
}

// پر کردن متن نمونه
function fillSample() {
    document.getElementById('input-unit-name').value = "Unit 1";
    document.getElementById('input-lesson-text').value = "It was an inevitable consequence of the new policy that the government had to take a comprehensive approach to the economic crisis. The situation was somewhat ambiguous, and many citizens felt that the authorities were trying to pull their legs. However, the resilient community managed to overcome the obstacles and substantially improved their living conditions.";
}

// استخراج کلمات از متن
function extractWords() {
    const unit = document.getElementById('input-unit-name').value.trim();
    const text = document.getElementById('input-lesson-text').value.trim();

    if (!unit || !text) {
        alert("لطفاً نام درس و متن را وارد کنید.");
        return;
    }

    let foundWords = [];
    let foundSents = [];
    let seen = new Set();

    // پیدا کردن کلمات B2
    const wordRegex = /\b[a-zA-Z][a-zA-Z'-]{2,}\b/g;
    let match;
    while ((match = wordRegex.exec(text)) !== null) {
        const raw = match[0];
        const lower = raw.toLowerCase();
        if (B2.has(lower) && !seen.has(lower)) {
            seen.add(lower);
            foundWords.push({ word: raw, lower: lower });
        }
    }

    // پیدا کردن جملات طولانی
    const sentRegex = /[^.!?]+[.!?]+/g;
    while ((match = sentRegex.exec(text)) !== null) {
        const s = match[0].trim();
        if (s.length > 50 && s.split(/\s+/).length >= 12) {
            foundSents.push(s);
        }
    }

    lastExtractedData = { unit, words: foundWords, sents: foundSents };

    // ساخت پیش‌نمایش
    let html = `<p style="color:#22c55e; margin-bottom:10px;">تعداد ${foundWords.length} کلمه و ${foundSents.length} جمله پیدا شد:</p>`;

    foundWords.forEach((w, i) => {
        html += `
        <div class="extract-item">
            <label><input type="checkbox" checked data-type="word" data-index="${i}"> ${w.word} (B2)</label>
            <input type="text" placeholder="معنی فارسی (اختیاری)" data-trans-word="${i}" style="margin:0;">
        </div>`;
    });

    foundSents.forEach((s, i) => {
        html += `
        <div class="extract-item sent">
            <label><input type="checkbox" checked data-type="sent" data-index="${i}"> جمله دشوار</label>
            <div style="font-size:0.85rem; direction:ltr; text-align:left; margin-bottom:8px;">${s}</div>
            <input type="text" placeholder="ترجمه (اختیاری)" data-trans-sent="${i}" style="margin:0;">
        </div>`;
    });

    html += `<button class="btn btn-blue" onclick="saveExtractedCards()">💾 ذخیره درس</button>`;
    document.getElementById('preview-container').innerHTML = html;
}

// ذخیره کارت‌ها
function saveExtractedCards() {
    if (!lastExtractedData) return;
    const { unit, words, sents } = lastExtractedData;

    if (!appData.db[unit]) appData.db[unit] = [];
    let addedCount = 0;

    // ذخیره کلمات تیک‌خورده
    document.querySelectorAll('input[data-type="word"]:checked').forEach(cb => {
        const idx = cb.getAttribute('data-index');
        const w = words[idx];
        const transInput = document.querySelector(`input[data-trans-word="${idx}"]`);
        const trans = transInput && transInput.value.trim() ? transInput.value.trim() : "—";
        
        // جلوگیری از تکرار
        if (!appData.db[unit].some(c => c.word.toLowerCase() === w.lower)) {
            appData.db[unit].push({ type: 'word', word: w.word, trans: trans });
            addedCount++;
        }
    });

    // ذخیره جملات تیک‌خورده
    document.querySelectorAll('input[data-type="sent"]:checked').forEach(cb => {
        const idx = cb.getAttribute('data-index');
        const s = sents[idx];
        const transInput = document.querySelector(`input[data-trans-sent="${idx}"]`);
        const trans = transInput && transInput.value.trim() ? transInput.value.trim() : "—";
        
        appData.db[unit].push({ type: 'sent', word: s, trans: trans });
        addedCount++;
    });

    // ذخیره در حافظه
    localStorage.setItem('aef3_data_v4', JSON.stringify(appData));
    alert(`✅ ${addedCount} کارت جدید ذخیره شد!`);

    // پاک کردن فرم
    document.getElementById('input-unit-name').value = "";
    document.getElementById('input-lesson-text').value = "";
    document.getElementById('preview-container').innerHTML = "";

    // رفتن به تب مرور
    currentUnitName = unit;
    initQueue(unit);
    showTab('study');
}

// شروع مرور یک درس
function initQueue(unit) {
    currentUnitName = unit;
    currentQueue = appData.db[unit].map((_, index) => ({ index: index, box: 1 }));
    renderCard();
}

// نمایش کارت
function renderCard() {
    const container = document.getElementById('card-container');

    if (currentQueue.length === 0) {
        container.innerHTML = `
            <div class="card" style="text-align:center; justify-content:center;">
                <h2 style="color:#22c55e;">عالی بود! 🎉</h2>
                <p style="margin-top:10px; color:#cbd5e1;">مرور این درس تمام شد.</p>
                <button class="btn btn-blue" style="margin-top:20px;" onclick="initQueue('${currentUnitName}')">شروع مجدد</button>
            </div>`;
        return;
    }

    const currentItem = currentQueue[0];
    const cardData = appData.db[currentUnitName][currentItem.index];

    let html = `
    <div class="card">
        <div>
            <div class="word-text">${cardData.word}</div>
            <div class="trans-box" id="trans-box">معنی: ${cardData.trans}</div>
            <button class="show-trans-btn" id="show-btn" onclick="document.getElementById('trans-box').style.display='block'; this.style.display='none';">نمایش معنی</button>
        </div>
        <div class="actions">
            <button class="btn btn-wrong" onclick="handleAnswer(false)">بلد نبودم ❌</button>
            <button class="btn btn-right" onclick="handleAnswer(true)">بلدم ✔️</button>
        </div>
    </div>
    <div style="text-align:center; margin-top:15px;
