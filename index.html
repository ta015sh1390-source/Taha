<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>American English File 3 - Smart Flashcards</title>
<style>
:root{--primary:#4f46e5;--bg:#0f172a;--card-bg:#1e293b;--text:#f8fafc;--text-muted:#94a3b8;--accent:#22c55e;--danger:#ef4444;}
*{box-sizing:border-box;margin:0;padding:0;font-family:Tahoma,sans-serif;}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:20px;}
header{text-align:center;margin-bottom:20px;}
header h1{font-size:1.4rem;color:#818cf8;margin-bottom:5px;}
header p{font-size:0.85rem;color:var(--text-muted);}
.container{width:100%;max-width:700px;display:flex;flex-direction:column;gap:15px;}
.tabs{display:flex;gap:8px;margin-bottom:10px;}
.tab{flex:1;padding:10px;background:var(--card-bg);border:1px solid #334155;color:var(--text);border-radius:8px;cursor:pointer;font-size:0.9rem;}
.tab.active{background:var(--primary);border-color:var(--primary);}
.panel{display:none;}
.panel.active{display:block;}
.units-nav{display:flex;gap:8px;overflow-x:auto;padding-bottom:5px;margin-bottom:10px;}
.unit-btn{background:var(--card-bg);border:1px solid #334155;color:var(--text);padding:8px 14px;border-radius:8px;cursor:pointer;white-space:nowrap;font-size:0.85rem;}
.unit-btn.active{background:var(--primary);border-color:var(--primary);}
.card{background:var(--card-bg);border-radius:16px;padding:25px;border:1px solid #334155;display:flex;flex-direction:column;gap:15px;min-height:260px;justify-content:space-between;}
.card-header{display:flex;justify-content:space-between;font-size:0.8rem;color:var(--text-muted);}
.card-body{text-align:left;direction:ltr;display:flex;flex-direction:column;gap:10px;}
.word{font-size:1.4rem;font-weight:bold;color:#38bdf8;word-break:break-word;}
.example{font-size:0.95rem;color:#cbd5e1;font-style:italic;background:#0f172a;padding:10px;border-radius:6px;border-left:3px solid var(--primary);}
.translation-box{background:#111827;padding:10px;border-radius:8px;text-align:right;direction:rtl;display:none;border:1px dashed #4b5563;font-size:0.95rem;color:#facc15;}
.toggle-trans-btn{background:#334155;color:#e2e8f0;border:none;padding:6px 12px;border-radius:6px;cursor:pointer;font-size:0.8rem;align-self:flex-start;}
.actions{display:flex;gap:10px;}
.btn{flex:1;padding:12px;border:none;border-radius:8px;font-weight:bold;cursor:pointer;font-size:1rem;color:white;}
.btn-wrong{background:var(--danger);}
.btn-right{background:var(--accent);}
.stats{display:flex;justify-content:space-between;font-size:0.85rem;color:var(--text-muted);background:#1e293b;padding:10px 15px;border-radius:8px;}
textarea{width:100%;min-height:180px;padding:12px;border-radius:8px;background:#0f172a;color:var(--text);border:1px solid #334155;font-family:monospace;font-size:0.9rem;direction:ltr;}
.input-row{display:flex;gap:8px;margin:8px 0;}
.input-row input{flex:1;padding:10px;border-radius:8px;background:#0f172a;color:var(--text);border:1px solid #334155;font-size:0.9rem;}
.primary-btn{background:var(--primary);color:white;border:none;padding:12px 20px;border-radius:8px;cursor:pointer;font-weight:bold;font-size:0.95rem;}
.secondary-btn{background:#334155;color:white;border:none;padding:10px 16px;border-radius:8px;cursor:pointer;font-size:0.85rem;}
.section-title{font-size:1rem;color:#818cf8;margin:15px 0 8px;font-weight:bold;}
.extract-item{background:#0f172a;padding:10px;border-radius:8px;margin-bottom:8px;border-left:3px solid var(--accent);font-size:0.9rem;}
.extract-item.sentence{border-left-color:#f59e0b;}
.extract-item .meta{font-size:0.75rem;color:var(--text-muted);margin-top:4px;}
.checkbox-row{display:flex;align-items:flex-start;gap:8px;}
.checkbox-row input{width:18px;height:18px;cursor:pointer;margin-top:4px;flex-shrink:0;}
.hint{font-size:0.8rem;color:var(--text-muted);margin-bottom:8px;line-height:1.6;}
.badge{display:inline-block;padding:2px 6px;border-radius:4px;font-size:0.7rem;background:#4f46e5;color:white;margin-left:5px;}
.badge.b2{background:#0891b2;}
.badge.b2p{background:#4f46e5;}
.badge.sent{background:#f59e0b;}
.empty{text-align:center;color:var(--text-muted);padding:30px;font-size:0.9rem;}
</style>
</head>
<body>

<header>
<h1>American English File 3 — Smart Flashcards</h1>
<p>فلش‌کارت هوشمند آفلاین • تشخیص B2+ • تکرار جعبه‌ای</p>
</header>

<div class="container">
<div class="tabs">
<button class="tab active" onclick="switchTab('study')">📚 مرور</button>
<button class="tab" onclick="switchTab('import')">➕ ورود متن</button>
</div>

<div id="studyPanel" class="panel active">
<div class="units-nav" id="unitsNav"></div>
<div class="stats">
<span id="progressText">—</span>
<span id="scoreText">—</span>
</div>
<div class="card" id="cardContainer">
<div class="empty">هنوز درسی اضافه نکردی. برو به تب «ورود متن».</div>
</div>
</div>

<div id="importPanel" class="panel">
<div class="section-title">۱. نام Unit</div>
<div class="input-row">
<input type="text" id="unitName" placeholder="مثلاً: Unit 5">
</div>
<div class="section-title">۲. متن درس را paste کن</div>
<p class="hint">متن را از PDF کپی کن و اینجا بگذار. کلمات B2+ و جملات دشوار به‌صورت خودکار استخراج می‌شوند.</p>
<textarea id="lessonText" placeholder="Paste your lesson text here..."></textarea>
<div class="input-row">
<button class="primary-btn" onclick="extractAndPreview()">🔍 استخراج</button>
<button class="secondary-btn" onclick="loadSample()">نمونه</button>
</div>
<div id="previewArea"></div>
</div>
</div>

const B2P_WORDS = new Set("ubiquitous meticulous ambiguity inevitable resilient comprehensive substantial paradigm juxtaposition serendipity ephemeral quintessential notwithstanding dichotomy cacophony idiosyncrasy pernicious obfuscate proliferate sycophant trepidation anomaly esoteric cogent pragmatic tenacious vociferous ineffable perfunctory indefatigable magnanimous munificent obstinate ostentatious parsimonious recalcitrant sagacious taciturn vehement zealous".split(" "));

const STORAGE_KEY = 'aef3_flashcards_v2';
let state = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
if(!state.db) state.db = {};
if(!state.progress) state.progress = {};

let currentUnit = null;
let queue = [];
let lastExtract = null;

function save(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); }

function switchTab(name){
  document.querySelectorAll('.tab').forEach((t,i)=>{
    t.classList.toggle('active', (name==='study'&&i===0)||(name==='import'&&i===1));
  });
  document.getElementById('studyPanel').classList.toggle('active', name==='study');
  document.getElementById('importPanel').classList.toggle('active', name==='import');
}

function detectLevel(word){
  const w = word.toLowerCase().replace(/[^a-z']/g,'');
  if(B2P_WORDS.has(w)) return 'B2+';
  if(B2_WORDS.has(w)) return 'B2';
  return null;
}

function extractFromText(text){
  const words = new Map();
  const sentences = [];
  const wordRegex = /\b[a-zA-Z][a-zA-Z'-]{2,}\b/g;
  let m;
  while((m = wordRegex.exec(text)) !== null){
    const raw = m[0];
    const low = raw.toLowerCase();
    const level = detectLevel(low);
    if(level){
      if(!words.has(low)) words.set(low, { word: raw, level, count: 1, example: '' });
      else words.get(low).count++;
    }
  }
  const sentenceRegex = /[^.!?]+[.!?]+/g;
  let s;
  while((s = sentenceRegex.exec(text)) !== null){
    const sent = s[0].trim();
    if(sent.length < 40) continue;
    const wc = sent.split(/\s+/).length;
    const hasComplex = /[;:—–]/.test(sent);
    const hasB2Plus = sent.split(/\s+/).some(w => B2P_WORDS.has(w.toLowerCase().replace(/[^a-z']/g,'')));
    const b2count = sent.split(/\s+/).filter(w => B2_WORDS.has(w.toLowerCase().replace(/[^a-z']/g,''))).length;
    if(wc >= 18 || hasComplex || hasB2Plus || b2count >= 2){
      sentences.push({ text: sent, length: wc });
    }
  }
  words.forEach((info, key) => {
    const re = new RegExp(`[^.!?]*\\b${key}\\b[^.!?]*[.!?]`, 'i');
    const match = text.match(re);
    if(match) info.example = match[0].trim();
  });
  return {
    words: Array.from(words.values()).sort((a,b)=> a.level==='B2+' ? -1 : 1),
    sentences: sentences.slice(0, 25)
  };
}

function extractAndPreview(){
  const text = document.getElementById('lessonText').value.trim();
  const unit = document.getElementById('unitName').value.trim();
  if(!text){ alert('متن درس را وارد کن!'); return; }
  if(!unit){ alert('نام Unit را وارد کن!'); return; }
  const result = extractFromText(text);
  lastExtract = { unit, ...result };
  if(result.words.length === 0 && result.sentences.length === 0){
    document.getElementById('previewArea').innerHTML = '<div class="empty">چیزی استخراج نشد. متن کوتاه است یا کلمات B2 ندارد.</div>';
    return;
  }

  html += '<p class="hint">هر موردی که می‌خواهی به فلش‌کارت اضافه شود را تیک بزن.</p>';
  if(result.words.length){
    html += `<div class="section-title">کلمات (${result.words.length})</div>`;
    result.words.forEach((w, i) => {
      const badge = w.level === 'B2+' ? '<span class="badge b2p">B2+</span>' : '<span class="badge b2">B2</span>';
      html += `<div class="extract-item">
        <div class="checkbox-row">
          <input type="checkbox" checked data-type="word" data-idx="${i}" id="w_${i}">
          <label for="w_${i}" style="flex:1;cursor:pointer;direction:ltr;text-align:left;">
            <strong>${w.word}</strong> ${badge}
            <div class="meta">تکرار: ${w.count}${w.example ? ' • ' + w.example.slice(0,90) + '…' : ''}</div>
          </label>
        </div>
        <input type="text" placeholder="معنی فارسی (اختیاری)" data-trans-idx="${i}" style="width:100%;padding:6px;border-radius:6px;background:#1e293b;color:white;border:1px solid #334155;font-size:0.85rem;margin-top:4px;">
      </div>`;
    });
  }
  if(result.sentences.length){
    html += `<div class="section-title">جملات دشوار (${result.sentences.length})</div>`;
    result.sentences.forEach((s, i) => {
      html += `<div class="extract-item sentence">
        <div class="checkbox-row">
          <input type="checkbox" checked data-type="sentence" data-idx="${i}" id="s_${i}">
          <label for="s_${i}" style="flex:1;cursor:pointer;direction:ltr;text-align:left;">
            <span class="badge sent">جمله</span>
            <div style="margin-top:4px;">${s.text}</div>
            <div class="meta">${s.length} کلمه</div>
          </label>
        </div>
        <input type="text" placeholder="معنی/توضیح فارسی (اختیاری)" data-trans-sent="${i}" style="width:100%;padding:6px;border-radius:6px;background:#1e293b;color:white;border:1px solid #334155;font-size:0.85rem;margin-top:4px;">
      </div>`;
    });
  }
  html += `<button class="primary-btn" style="margin-top:15px;width:10
